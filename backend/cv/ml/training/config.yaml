# Konfiguracja treningu Square Classifier (CNN)
# Plik czytany przez train_classifier.py

# --- Dane ---
dataset_dir: "cv/ml/data/dataset"   # względem katalogu backend/
patch_size: 70                        # px — rozmiar wejściowego patcha
val_split: 0.2                        # 20% danych jako zbiór walidacyjny

# --- Architektura ---
# SquareCNN: Conv(32)→Pool→Conv(64)→Pool→Conv(128)→Pool→FC(256)→FC(1)+Sigmoid
dropout: 0.5                          # regularyzacja dropout w FC

# --- Trening ---
epochs: 25                            # liczba epok (20-30 wystarczy)
batch_size: 32                        # powiększ do 64 jeśli masz dużo RAM
learning_rate: 0.001                  # Adam lr; zmniejsz do 0.0003 jeśli loss oscyluje
weight_decay: 0.0001                  # L2 regularyzacja

# --- Early stopping ---
patience: 7                           # zatrzymaj jeśli val_loss nie poprawia się przez N epok

# --- Scheduler ---
# lr zmniejsza się o factor co step_size epok (np. 0.1 × lr co 10 epok)
lr_scheduler_factor: 0.1
lr_scheduler_step_size: 10

# --- Zapis ---
weights_out: "cv/ml/weights/square_classifier.pth"  # względem backend/
save_best_only: true                  # zachowaj tylko najlepsze wagi (val_loss)

# --- Logi ---
log_interval: 5                       # wyświetlaj postęp co N batchy
